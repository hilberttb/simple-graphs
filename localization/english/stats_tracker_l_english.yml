l_english:
 stats_tracker_debug_snapshot_date:0 "SIMPLE_GRAPHS snapshot on [GetCurrentDate.GetStringLong] (year [GetCurrentDate.GetYear])"
 stats_tracker_debug_faith:0 "SIMPLE_GRAPHS FAITH [THIS.Faith.GetNameNoTooltip] counties=[THIS.Var('stats_tracker_running_count').GetValue] enc=[THIS.Var('stats_tracker_encoded').GetValue]"
 stats_tracker_debug_culture:0 "SIMPLE_GRAPHS CULTURE [THIS.Culture.GetNameNoTooltip] counties=[THIS.Var('stats_tracker_running_count').GetValue] enc=[THIS.Var('stats_tracker_encoded').GetValue]"
 stats_tracker_debug_click_faith:0 "SIMPLE_GRAPHS_CLICK faith [THIS.Faith.GetNameNoTooltip] selected"
 stats_tracker_debug_click_culture:0 "SIMPLE_GRAPHS_CLICK culture [THIS.Culture.GetNameNoTooltip] selected"
 stats_tracker_debug_registry:0 "SIMPLE_GRAPHS_REGISTRY faiths=[GetGlobalVariable('simple_graphs_registry_faith_count').GetValue] cultures=[GetGlobalVariable('simple_graphs_registry_culture_count').GetValue]"

# ---- renderer UI ------------------------------------------------------------
# No square brackets in any of these literal labels: brackets are data-function
# syntax, not text (README_DATA_COLLECTION.md gotcha 5).
 SIMPLE_GRAPHS_OPEN_BUTTON:0 "County graph"
 SIMPLE_GRAPHS_WINDOW_TITLE:0 "Simple Graphs - county count over time"
 SIMPLE_GRAPHS_CLOSE:0 "Close"
 SIMPLE_GRAPHS_LBL_SNAPSHOTS:0 "snapshots taken:"
 SIMPLE_GRAPHS_LBL_SEGCOUNT:0 "segments:"
 SIMPLE_GRAPHS_LBL_PLAINCOUNT:0 "plain points:"
 SIMPLE_GRAPHS_LBL_SEGCOLS:0 "idx / packed entry / y start / y end"
 SIMPLE_GRAPHS_LBL_PLAINCOLS:0 "idx / stored value / counties"

# ---- the picker -------------------------------------------------------------
# No faith or culture is named anywhere in the picker - it is driven entirely by
# the simple_graphs_all_faiths / _all_cultures registries.
 SIMPLE_GRAPHS_LBL_PICKER:0 "PICK ONE - click any row to plot it"
 SIMPLE_GRAPHS_LBL_FAITHCOUNT:0 "faiths:"
 SIMPLE_GRAPHS_LBL_CULTCOUNT:0 "cultures:"
 SIMPLE_GRAPHS_LBL_GENERICCOLS:0 "FAITHS - click a row. name / counties / pts / seg"
 SIMPLE_GRAPHS_LBL_CULTCOLS:0 "CULTURES - click a row. name / counties / pts / seg"

# ---- the plot ---------------------------------------------------------------
# Bound to whichever faith or culture was last clicked in the picker. Nothing
# here names a faith or a culture - that is the entire point.
 SIMPLE_GRAPHS_LBL_SELECTED:0 "SHOWING:"
 SIMPLE_GRAPHS_LBL_NOSEL:0 "nothing selected yet - click a faith or a culture in the list on the right"
 SIMPLE_GRAPHS_LBL_SELPLOT:0 "Counties over time - oldest snapshot at the left, higher means more counties."
 SIMPLE_GRAPHS_TT_CLICK:0 "Click to plot this one."
 SIMPLE_GRAPHS_LBL_OBSERVER:0 "OBSERVER MODE - selection is unavailable without a player character. Everything else on this window still works."
