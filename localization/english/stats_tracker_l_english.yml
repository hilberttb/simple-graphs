# ---- renderer UI ------------------------------------------------------------
# No square brackets in any of these literal labels: brackets are data-function
# syntax, not text (README_DATA_COLLECTION.md gotcha 5).
 SIMPLE_GRAPHS_OPEN_BUTTON:0 "County graph"
 SIMPLE_GRAPHS_WINDOW_TITLE:0 "Simple Graphs - left column is the catholic hardcode, right column is generic"
 SIMPLE_GRAPHS_CLOSE:0 "Close"
 SIMPLE_GRAPHS_LBL_REFS:0 "Reference strip - 3 strokes = line, FloatToCVector2f, int math"
 SIMPLE_GRAPHS_LBL_PLOT:0 "Plot - one segment per snapshot pair, oldest at left. Higher = more counties."
 SIMPLE_GRAPHS_LBL_SNAPSHOTS:0 "snapshots taken:"
 SIMPLE_GRAPHS_LBL_SEGCOUNT:0 "segments:"
 SIMPLE_GRAPHS_LBL_PLAINCOUNT:0 "plain points:"
 SIMPLE_GRAPHS_LBL_SEGCOLS:0 "idx / packed entry / y start / y end"
 SIMPLE_GRAPHS_LBL_PLAINCOLS:0 "idx / stored value / counties"

# ---- generic enumeration (right column) -------------------------------------
# Rung A is the two counts, rung B is the names column, rung C is pts/seg,
# rung D is the cross-check panel. See the comments in simple_graphs_window.gui.
 SIMPLE_GRAPHS_LBL_GENERIC:0 "GENERIC PATH - no faith or culture named anywhere below"
 SIMPLE_GRAPHS_LBL_FAITHCOUNT:0 "faiths:"
 SIMPLE_GRAPHS_LBL_CULTCOUNT:0 "cultures:"
 SIMPLE_GRAPHS_LBL_GENERICCOLS:0 "FAITHS - name / counties / pts / seg"
 SIMPLE_GRAPHS_LBL_CULTCOLS:0 "CULTURES - name / counties / pts / seg"
 SIMPLE_GRAPHS_LBL_XCHECK:0 "CROSS-CHECK - catholic by key. Must match plain points on the left."
 SIMPLE_GRAPHS_LBL_XCHECKCOLS:0 "idx / stored value / counties"
