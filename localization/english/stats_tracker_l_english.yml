 stats_tracker_debug_catholic_seg:0 "SIMPLE_GRAPHS_RENDER catholic segment packed=[THIS.Var('stats_tracker_seg_entry').GetValue] (decode: y_start = packed/1000 mod 1000, y_end = packed mod 1000)"
